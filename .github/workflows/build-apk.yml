name: Build Android APK
# Run it from the Actions tab (Run workflow). The APK appears under "Artifacts" at the bottom of the run page.
# Pushing a tag like v1.0.0 also attaches the APK to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Apply branding (name, icons, config)
        run: node tools/apply-brand.mjs && node tools/prepare-android.mjs
      - name: Create the Android project
        run: npx cap add android
      - name: Make launcher icon + splash from the brand logo
        run: |
          mkdir -p assets
          convert brand/logo-512.png -resize 1024x1024 assets/icon-only.png
          convert -size 1024x1024 xc:none brand/logo-512.png -resize 680x680 -gravity center -composite assets/icon-foreground.png
          convert -size 1024x1024 xc:white assets/icon-background.png
          convert -size 2732x2732 xc:white brand/logo-512.png -resize 640x640 -gravity center -composite assets/splash.png
          cp assets/splash.png assets/splash-dark.png
          npx @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
